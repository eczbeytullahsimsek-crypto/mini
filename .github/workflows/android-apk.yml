name: Android APK

on:
  push:
    branches: ["arena/78591f98-mini1", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        run: |
          echo "Android SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Test HTML interface logic
        run: |
          npm install --no-save --prefix .cache/ui-test jsdom@26.1.0
          NODE_PATH="$PWD/.cache/ui-test/node_modules" node tools/ui-test.cjs
      - name: Test and build APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atelier-Pad-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="atelier-pad-debug-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Atelier Pad debug APK ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built from ${GITHUB_SHA}." \
            --prerelease
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
